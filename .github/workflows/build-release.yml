# Multi-platform release build — see .github/CI-PIPELINE.md for full settings.
name: Build release (all platforms)

on:
  workflow_dispatch:
    inputs:
      build_desktop:
        description: Windows + Linux + macOS desktop
        type: boolean
        default: true
      build_android:
        description: Android arm64 APK
        type: boolean
        default: true
      build_ios:
        description: iOS simulator .app (same macOS runner as .dmg — one queue slot)
        type: boolean
        default: true
  push:
    branches:
      - main

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # nttld/setup-ndk expects release tags (r26b), not the numeric build id (26.1.10909125).
  ANDROID_NDK_VERSION: r26b
  JAVA_VERSION: "17"
  ANDROID_COMPILE_SDK: "36"

jobs:
  desktop:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.build_desktop)
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows
            runner: windows-latest
          - id: linux
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Linux system dependencies
        if: matrix.id == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libayatana-appindicator3-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Tauri build
        env:
          CI: true
        run: npm run tauri build

      - name: Stage desktop artifacts
        shell: bash
        run: bash scripts/stage-desktop-artifacts.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: custom-sda-desktop-${{ matrix.id }}
          path: release-artifacts
          if-no-files-found: error

  android:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.build_android)
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: android-actions/setup-android@v3
        with:
          # Google removed the legacy `tools` package; default v3 install fails on sdkmanager.
          packages: platform-tools

      - name: Install Android SDK platform
        shell: pwsh
        run: |
          $api = $env:ANDROID_COMPILE_SDK
          sdkmanager --install "platforms;android-$api" "build-tools;35.0.0"

      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.ANDROID_NDK_VERSION }}
          link-to-sdk: true
          local-cache: true

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust cache (Android)
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> ../target
          shared-key: android-aarch64
          cache-targets: aarch64-linux-android

      - name: Environment (Android)
        shell: pwsh
        run: |
          echo "ANDROID_HOME=$env:ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$env:ANDROID_SDK_ROOT"
          echo "NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}"
          echo "NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $env:GITHUB_ENV
          echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $env:GITHUB_ENV
          echo "ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}" >> $env:GITHUB_ENV

      - run: npm ci

      - name: Init Android project if missing
        shell: pwsh
        run: |
          if (-not (Test-Path src-tauri/gen/android)) {
            npm run tauri android init -- --ci
          }

      - name: Build signed APK
        run: npm run build:apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: custom-sda-android-arm64
          path: release/*.apk
          if-no-files-found: error

  # One macOS runner: .dmg + iOS simulator (avoids two jobs fighting for arm64 capacity).
  macos:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
        (inputs.build_desktop || inputs.build_ios))
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim

      - run: npm ci

      - run: npm run build

      - name: Tauri build (macOS desktop .dmg)
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.build_desktop)
        env:
          CI: true
          APPLE_SIGNING_IDENTITY: '-'
        run: npm run tauri build

      - name: Ad-hoc codesign macOS .app
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.build_desktop)
        shell: bash
        run: |
          set +e
          app=$(find target src-tauri/target -type d -name '*.app' 2>/dev/null | head -1)
          set -e
          if [[ -z "$app" ]]; then
            echo "No .app bundle — skip codesign"
            exit 0
          fi
          echo "Ad-hoc signing: $app"
          codesign --force --deep --sign - "$app" || echo "::warning::codesign failed"

      - name: Stage macOS desktop artifacts
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.build_desktop)
        run: bash scripts/stage-desktop-artifacts.sh

      - name: Upload macOS desktop artifact
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.build_desktop)
        uses: actions/upload-artifact@v4
        with:
          name: custom-sda-desktop-macos
          path: release-artifacts
          if-no-files-found: error

      - name: Init iOS project
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.build_ios)
        run: npm run tauri ios init -- --ci

      - name: CocoaPods
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.build_ios)
        run: bash scripts/ios-pod-install.sh

      - name: Build iOS (simulator)
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.build_ios)
        run: npm run tauri ios build -- --target aarch64-sim

      - name: Stage iOS artifacts
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.build_ios)
        run: |
          mkdir -p release/ios-artifacts
          find src-tauri/gen/apple -name "*.app" -maxdepth 10 -exec cp -R {} release/ios-artifacts/ \; 2>/dev/null || true
          ls -laR release/ios-artifacts || true

      - name: Upload iOS simulator app
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.build_ios)
        uses: actions/upload-artifact@v4
        with:
          name: custom-sda-ios-simulator
          path: release/ios-artifacts
          if-no-files-found: warn

  publish-release:
    name: Publish GitHub Release
    needs: [desktop, android, macos]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag from package.json
        id: meta
        shell: bash
        run: |
          ver=$(node -p "require('./package.json').version")
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "tag=v${ver}" >> "$GITHUB_OUTPUT"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: custom-sda-*
          merge-multiple: true
          path: release-assets

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          # Only installers — not .app internals (Info.plist etc. collide on asset name).
          mkdir -p release-upload
          declare -A seen=()
          while IFS= read -r -d '' f; do
            base="$(basename "$f")"
            case "$base" in
              *.exe|*.msi|*.dmg|*.deb|*.AppImage|*.apk|*.zip) ;;
              *) continue ;;
            esac
            if [[ -n "${seen[$base]:-}" ]]; then
              echo "Skip duplicate asset name: $base ($f)"
              continue
            fi
            seen[$base]=1
            cp -f "$f" "release-upload/$base"
          done < <(find release-assets -type f -print0)
          mapfile -t files < <(find release-upload -type f | sort)
          if ((${#files[@]} == 0)); then
            echo "::error::No installer files to upload (.exe/.msi/.dmg/.deb/.AppImage/.apk/.zip)"
            find release-assets -type f | head -100 || true
            exit 1
          fi
          echo "Uploading:"
          printf '  %s\n' "${files[@]}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists — replacing assets"
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            echo "Creating release $TAG at commit $GITHUB_SHA"
            gh release create "$TAG" \
              --title "Custom SDA $TAG" \
              --generate-notes \
              --target "$GITHUB_SHA" \
              "${files[@]}"
          fi
          gh release edit "$TAG" --latest
