[package]
name = "custom-sda"
version = "1.0.5"
description = "Modern Steam Desktop Authenticator"
authors = ["Custom SDA"]
edition = "2021"

[lib]
name = "custom_sda_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
base64 = "0.22"
zeroize = { version = "1", features = ["derive"] }
steamguard = "0.18"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "cookies"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
parking_lot = "0.12"
hmac = "0.12"
sha1 = "0.10"
byteorder = "1"
sha2 = "0.10"
flate2 = "1.0"
urlencoding = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-os = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-biometric = "2.5.0"
